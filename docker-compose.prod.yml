# ---------------------------------------------------------------------------
# Requisito #2 y #3 - Produccion (Droplet)
# Bonus           - Reverse proxy con Nginx
# Nueva sesion     - Blue-Green Deployment (dos slots de API: blue y green)
#
#   # despliegue real (recomendado): el script decide el slot y conmuta el trafico
#   ./scripts/blue-green.sh deploy MY_USER/todos-api:sha-abc123
#
#   # a mano, solo para probar en local: hay que definir las dos claves de imagen
#   API_IMAGE_BLUE=... API_IMAGE_GREEN=... \
#   docker compose -f docker-compose.prod.yml --env-file .env.production \
#       up -d --wait
#
# Diferencias con docker-compose.yml:
#   - la API se tira (pull) del registro, no se construye en el servidor
#   - ni las APIs ni MongoDB publican puertos en el host: solo Nginx (80/443)
#   - el proxy traduce http://your_domain.com -> http://api-<color>:3000
#
# Blue-green:
#   - `api-blue` y `api-green` son dos slots IDENTICOS (misma imagen, mismas
#     variables, mismo healthcheck). Solo uno recibe trafico; el otro esta
#     parado o en espera como blanco de rollback.
#   - El color activo vive en nginx/upstream/active.conf, no aqui. Por eso
#     nginx NO depende de `service_healthy` de la API: en blue-green hay
#     siempre un color parado y un depends_on compartido bloquearia el arranque.
#   - Las dos claves de imagen (API_IMAGE_BLUE / API_IMAGE_GREEN) se escriben
#     en .env.production; las gestiona scripts/blue-green.sh, que antes de
#     conmutar espera al healthcheck del slot nuevo.
#   - MongoDB es unico y compartido por ambos slots: mismo volumen, cero
#     perdida de datos en la conmutacion.
#
# La API sigue siendo alcanzable en el puerto 3000 por si se quiere saltar el proxy:
#   ssh root@<ip> 'curl http://127.0.0.1:3000/health'
# Para publicarla de nuevo, descomentar el bloque `ports` del servicio `api-blue`.
# ---------------------------------------------------------------------------

name: todos-prod

# Contrato comun de los dos slots azul/verde: definido una sola vez con un
# ancla de YAML para que blue y green no puedan divergir.
x-api-slot: &api-slot
  restart: always
  # Descomentar para exponer la API directamente en el host ademas del proxy.
  # ports:
  #   - "${API_PORT:-3000}:3000"
  expose:
    - "3000"
  environment:
    NODE_ENV: production
    PORT: "3000"
    # nginx es el unico proxy delante: hace falta para que Express resuelva
    # req.ip y req.protocol a partir de X-Forwarded-*.
    TRUST_PROXY: "true"
    MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD:?define MONGO_ROOT_PASSWORD en .env.production}@mongo:27017/${MONGO_DATABASE:-todos}?authSource=admin
  depends_on:
    mongo:
      condition: service_healthy
  # Declarado aqui (y no solo en el Dockerfile) porque blue-green.sh espera a
  # `condition: service_healthy` antes de conmutar el trafico: el contrato de
  # salud debe vivir en el manifiesto de despliegue, no dentro de la imagen.
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s
  networks:
    - backend
    - frontend

services:
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Sustituye el default.conf que trae la imagen. Solo lectura.
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Estado del despliegue: active.conf dice que color recibe trafico.
      # Lo escribe scripts/blue-green.sh y lo recarga con `nginx -s reload`,
      # asi la conmutacion no corta ni una peticion.
      - ./nginx/upstream:/etc/nginx/upstream:ro
      # Certificados si habilitas el bloque HTTPS (ver nginx/conf.d/default.conf).
      # - ./nginx/certs:/etc/nginx/certs:ro
    # Sin depends_on de la API: ver comentario de cabecera.
    healthcheck:
      # wget de busybox: `-q -O /dev/null` es la forma más portable (nginx:alpine
      # no trae curl). Devuelve error si nginx no responde 200.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend

  # Slot AZUL. Arranca y se apaga segun decida scripts/blue-green.sh.
  api-blue:
    <<: *api-slot
    image: ${API_IMAGE_BLUE:?define API_IMAGE_BLUE en .env.production (usa scripts/blue-green.sh deploy)}

  # Slot VERDE. Identico a blue: la unica diferencia es la imagen etiquetada.
  api-green:
    <<: *api-slot
    image: ${API_IMAGE_GREEN:?define API_IMAGE_GREEN en .env.production (usa scripts/blue-green.sh deploy)}

  mongo:
    image: mongo:8.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?define MONGO_ROOT_USERNAME en .env.production}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?define MONGO_ROOT_PASSWORD en .env.production}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-todos}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Autentica de verdad: valida que el servidor responde Y que las credenciales
      # del .env.production son correctas. `$$` escapa el $ para que lo exponga el
      # shell del contenedor, no compose.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

volumes:
  mongo-data:
    name: ${MONGO_VOLUME_NAME:-todos-mongo-data}

networks:
  backend:
    internal: true
  frontend:
