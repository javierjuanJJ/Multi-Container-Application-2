# Configuracion de Prometheus para el stack todos-prod (blue-green).
# La recarga sin reiniciar es:  curl -X POST http://localhost:9090/-/reload

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Sondas HTTP contra el despliegue blue-green. La conversion de direccion es
  # la tipica de blackbox: la URL a comprobar viaja en __param_target y el
  # exporter real se pone en __address__.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://nginx/nginx-health     # el proxy: si esto falla no entra nada
          - http://nginx/health           # el color ACTIVO visto desde el cliente
          - http://api-blue:3000/health   # slot azul directo (standby o activo)
          - http://api-green:3000/health  # slot verde directo (standby o activo)
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Metricas de contenedores: consumo y reinicios de cada slot.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
