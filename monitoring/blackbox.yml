# Modulos de sondeo del blackbox-exporter.
# Solo se usa http_2xx: el /health de la API y el /nginx-health devuelven 200
# cuando la pieza esta operativa.

modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
