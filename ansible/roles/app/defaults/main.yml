---
# Valores por defecto del rol `app`. Se pueden sobreescribir sin editar el rol:
#   ansible-playbook todos.yml -e app_image=mi-usuario/todos-api:1.2.3

# Donde vive el stack en el servidor
app_dir: /opt/todos
app_user: deploy
app_group: docker

# Raiz del repositorio en la maquina de control: de aqui se copian los ficheros
# de compose y la configuracion de nginx al Droplet.
app_project_root: "{{ playbook_dir | dirname }}"

# Ficheros del stack
app_compose_file_src: "{{ app_project_root }}/docker-compose.prod.yml"
app_compose_file_name: docker-compose.prod.yml
app_nginx_conf_src: "{{ app_project_root }}/nginx/conf.d/default.conf"

# Variables de la imagen publicada por el pipeline
app_image: ""
app_registry_username: ""
app_registry_password: ""

# Secretos de MongoDB. Guardalos en un vault, nunca en el inventario ni en git:
#   ansible-vault encrypt_string 'contrasena-larga-y-aleatoria' --name 'mongo_password'
app_mongo_username: root
app_mongo_password: ""
app_mongo_database: todos
app_mongo_volume_name: todos-mongo-data

# Puertos publicados por el reverse proxy
app_http_port: 80
app_https_port: 443

# Etiqueta usada para --env-file
app_env_file: .env.production

# Healthcheck contra el reverse proxy
app_healthcheck_path: /health
app_healthcheck_host: 127.0.0.1
app_healthcheck_status: 200