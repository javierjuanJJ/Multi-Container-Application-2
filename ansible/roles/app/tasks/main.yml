---
# ---------------------------------------------------------------------------
# Requisito #2 y #3 + sesion Blue-Green - Despliegue en el Droplet
#
# Copia al servidor el compose, la config de nginx y el script blue-green.sh,
# y luego deja que el propio script despliegue: la imagen nueva arranca en el
# color inactivo, espera a su healthcheck y solo despues conmuta el trafico
# con `nginx -s reload`. MongoDB es unico y compartido por los dos colores,
# asi que los datos del volumen sobreviven a cada despliegue.
#
# OJO: nginx/upstream/active.conf NO se copia: es el estado del despliegue en
# el servidor (que color recibe trafico) y subirlo romperia el color activo.
# El propio script lo crea si no existe.
# ---------------------------------------------------------------------------

- name: Validar que la imagen de la API esta definida
  ansible.builtin.assert:
    that:
      - app_image | length > 0
      - app_mongo_password | length > 0
    fail_msg: >-
      Faltan app_image y/o app_mongo_password. Pasa la imagen con
      -e app_image=mi-usuario/todos-api:<tag> y la contrasena desde el vault
      (vars_files o --extra-vars).
    quiet: true

- name: Crear el directorio del stack
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Crear el directorio de configuracion de nginx
  ansible.builtin.file:
    path: "{{ app_dir }}/nginx/conf.d"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Copiar el fichero de compose de produccion
  ansible.builtin.copy:
    src: "{{ app_compose_file_src }}"
    dest: "{{ app_dir }}/{{ app_compose_file_name }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  register: app_compose_file

- name: Copiar la configuracion del reverse proxy
  ansible.builtin.copy:
    src: "{{ app_nginx_conf_src }}"
    dest: "{{ app_dir }}/nginx/conf.d/default.conf"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  register: app_nginx_conf

# El motor del despliegue blue-green: decide el color, espera al healthcheck
# del slot nuevo y conmuta el trafico con `nginx -s reload`.
- name: Copiar el script de despliegue blue-green
  ansible.builtin.copy:
    src: "{{ app_deploy_script_src }}"
    dest: "{{ app_dir }}/blue-green.sh"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Generar el fichero de variables de entorno
  ansible.builtin.template:
    src: env.production.j2
    dest: "{{ app_dir }}/{{ app_env_file }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600" # contiene la contrasena de MongoDB
  no_log: true
  register: app_env

# El script crea nginx/upstream/active.conf si falta, completa las claves por
# color (API_IMAGE_BLUE/GREEN) a partir de lo que ya esta corriendo y solo
# despues valida con `docker compose config`. Fallar aqui es mucho mejor que
# fallar a mitad de una conmutacion.
- name: Validar la configuracion de compose
  ansible.builtin.command:
    argv: ["{{ app_dir }}/blue-green.sh", "validate"]
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  changed_when: false
  environment:
    COMPOSE_FILE: "{{ app_compose_file_name }}"
    ENV_FILE: "{{ app_env_file }}"

- name: Autenticarse en el registro de imagenes
  ansible.builtin.command:
    argv: [docker, login, --username, "{{ app_registry_username }}", --password-stdin]
  args:
    stdin: "{{ app_registry_password }}"
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  no_log: true
  changed_when: true
  when:
    - app_registry_username | length > 0
    - app_registry_password | length > 0

# Despliegue blue-green: la imagen nueva arranca en el color INACTIVO, se
# espera a su healthcheck, se verifica desde la red de nginx y SOLO DESPUES
# se conmuta el trafico. El color activo no se toca mientras tanto, y si algo
# falla antes de la conmutacion el trafico no se mueve.
- name: Desplegar con blue-green
  ansible.builtin.command:
    argv: "{{ app_deploy_command }}"
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  register: app_up
  changed_when: true
  environment:
    COMPOSE_FILE: "{{ app_compose_file_name }}"
    ENV_FILE: "{{ app_env_file }}"
    WAIT_TIMEOUT: "{{ app_wait_timeout }}"

- name: Mostrar el estado del despliegue
  ansible.builtin.command:
    argv: ["{{ app_dir }}/blue-green.sh", "status"]
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  changed_when: false
  register: app_ps
  environment:
    COMPOSE_FILE: "{{ app_compose_file_name }}"
    ENV_FILE: "{{ app_env_file }}"

- name: Estado de los contenedores
  ansible.builtin.debug:
    msg: "{{ app_ps.stdout_lines }}"

- name: Comprobar la salud de la API a traves del reverse proxy
  ansible.builtin.uri:
    url: "http://{{ app_healthcheck_host }}:{{ app_http_port }}{{ app_healthcheck_path }}"
    status_code: "{{ app_healthcheck_status }}"
    return_content: true
  register: app_healthcheck
  retries: 10
  delay: 5
  until: app_healthcheck is succeeded

- name: Resultado del despliegue
  ansible.builtin.debug:
    msg: >-
      Despliegue blue-green terminado con {{ app_image }} en
      http://{{ app_healthcheck_host }}:{{ app_http_port }}
      (healthcheck: {{ app_healthcheck.json.status }})