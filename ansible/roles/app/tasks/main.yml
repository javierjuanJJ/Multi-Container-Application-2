---
# ---------------------------------------------------------------------------
# Requisito #2 y #3 - Desplegar el stack con Docker Compose en el Droplet
#
# Copia los ficheros de compose + la config de nginx al servidor, tira la imagen
# publicada en Docker Hub y levanta el stack. MongoDB nunca se reinicia con
# `up -d`, asi que los datos del volumen sobreviven a cada despliegue.
# ---------------------------------------------------------------------------

- name: Validar que la imagen de la API esta definida
  ansible.builtin.assert:
    that:
      - app_image | length > 0
      - app_mongo_password | length > 0
    fail_msg: >-
      Faltan app_image y/o app_mongo_password. Pasa la imagen con
      -e app_image=mi-usuario/todos-api:<tag> y la contrasena desde el vault
      (vars_files o --extra-vars).
    quiet: true

- name: Crear el directorio del stack
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Crear el directorio de configuracion de nginx
  ansible.builtin.file:
    path: "{{ app_dir }}/nginx/conf.d"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Copiar el fichero de compose de produccion
  ansible.builtin.copy:
    src: "{{ app_compose_file_src }}"
    dest: "{{ app_dir }}/{{ app_compose_file_name }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  register: app_compose_file

- name: Copiar la configuracion del reverse proxy
  ansible.builtin.copy:
    src: "{{ app_nginx_conf_src }}"
    dest: "{{ app_dir }}/nginx/conf.d/default.conf"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  register: app_nginx_conf

- name: Generar el fichero de variables de entorno
  ansible.builtin.template:
    src: env.production.j2
    dest: "{{ app_dir }}/{{ app_env_file }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600" # contiene la contrasena de MongoDB
  no_log: true
  register: app_env

# Fallar aqui si el YAML es invalido es mucho mejor que fallar en `up -d`.
- name: Validar la configuracion de compose
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ app_env_file }}"
      - -f
      - "{{ app_compose_file_name }}"
      - config
      - --quiet
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  changed_when: false

- name: Autenticarse en el registro de imagenes
  ansible.builtin.command:
    argv: [docker, login, --username, "{{ app_registry_username }}", --password-stdin]
  args:
    stdin: "{{ app_registry_password }}"
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  no_log: true
  changed_when: true
  when:
    - app_registry_username | length > 0
    - app_registry_password | length > 0

- name: Descargar las imagenes del stack
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ app_env_file }}"
      - -f
      - "{{ app_compose_file_name }}"
      - pull
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  register: app_pull
  changed_when: "'Downloading' in app_pull.stdout or 'Pulled' in app_pull.stdout"

# --remove-orphans limpia contenedores de despliegues anteriores.
# Sin -d se espera al healthcheck de mongo y de la API antes de dar el paso por bueno.
- name: Levantar o actualizar el stack
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ app_env_file }}"
      - -f
      - "{{ app_compose_file_name }}"
      - up
      - -d
      - --remove-orphans
      - --wait
      - --wait-timeout
      - "120"
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  register: app_up
  changed_when: true

- name: Mostrar el estado del stack
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ app_env_file }}"
      - -f
      - "{{ app_compose_file_name }}"
      - ps
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  changed_when: false
  register: app_ps

- name: Estado de los contenedores
  ansible.builtin.debug:
    msg: "{{ app_ps.stdout_lines }}"

- name: Comprobar la salud de la API a traves del reverse proxy
  ansible.builtin.uri:
    url: "http://{{ app_healthcheck_host }}:{{ app_http_port }}{{ app_healthcheck_path }}"
    status_code: "{{ app_healthcheck_status }}"
    return_content: true
  register: app_healthcheck
  retries: 10
  delay: 5
  until: app_healthcheck is succeeded

- name: Resultado del despliegue
  ansible.builtin.debug:
    msg: >-
      Stack desplegado con {{ app_image }} en
      http://{{ app_healthcheck_host }}:{{ app_http_port }}
      (healthcheck: {{ app_healthcheck.json.status }})