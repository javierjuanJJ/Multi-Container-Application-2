# ---------------------------------------------------------------------------
# Reverse proxy (bonus) - nginx.conf incluido en /etc/nginx/conf.d/
#
# Resolucion dinamica del upstream: dentro de una red de Docker la IP del
# contenedor `api` cambia cada vez que se recrea. Declarando el host en una
# variable y usando `resolver 127.0.0.11` (el DNS interno de Docker) nginx
# resuelve `api` en cada peticion en vez de fijar la IP al arrancar. Asi un
# `docker compose restart api` no deja el proxy apuntando a una IP muerta.
# ---------------------------------------------------------------------------

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    listen [::]:80;

    # Sustituye _ por your_domain.com cuando configures el registro DNS.
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 1m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml image/svg+xml;

    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY   always;
    add_header Referrer-Policy        no-referrer-when-downgrade always;

    # Sonda de vida del propio nginx: la usa el healthcheck del contenedor y no
    # depende de que la API este arriba.
    location = /nginx-health {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        set $api_upstream http://api:3000;

        # Sin parte de URI en proxy_pass: se reenvia la ruta original intacta,
        # asi /todos y /todos/:id llegan intactos a la API.
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering on;
        proxy_redirect off;
    }

    # -----------------------------------------------------------------------
    # HTTPS opcional. Pasos:
    #   1. apuntar your_domain.com al Droplet (terraform ya crea el registro si
    #      defines domain_name + domain_record_name)
    #   2. emitir el certificado:  certbot certonly --webroot -w /var/www/certbot \
    #        -d your_domain.com
    #   3. montar los certificados (ver el volumen commented en compose.prod.yml)
    #   4. descomentar este bloque y recargar:  docker compose ... exec nginx nginx -s reload
    # -----------------------------------------------------------------------
    #
    # server {
    #     listen 443 ssl;
    #     listen [::]:443 ssl;
    #     http2 on;
    #     server_name your_domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     location / {
    #         set $api_upstream http://api:3000;
    #         proxy_pass $api_upstream;
    #         proxy_http_version 1.1;
    #         proxy_set_header   Connection "";
